name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

env:
  # rust-cache keys on the rustc version, so a floating `stable` cold-rebuilds every
  # cache each time Rust releases. Bump this deliberately instead.
  RUST_TOOLCHAIN: "1.98.0"
  RELEASE_BODY: |
    Create, name, and launch isolated Claude Desktop profiles.

    **macOS:** download the `.dmg` for your chip — `aarch64` for Apple Silicon, `x64` for Intel.
    Open it, drag the app to Applications.
    First open: macOS blocks it — clear the download flag with
    `xattr -dr com.apple.quarantine "/Applications/Claude Desktop Manager.app"`,
    or allow it once in **System Settings → Privacy & Security → Open Anyway**.

    **Windows (x64):** download the `-setup.exe` and run it.
    First run: SmartScreen shows "Windows protected your PC" (unsigned) — **More info → Run anyway**.

    The app lives in the **menu bar / system tray**, not the Dock or taskbar.
    Installed copies update themselves silently; the tray also has *Check for Updates…*.

jobs:
  # The updater compares versions, so every build has to carry a higher one than
  # the last. The bump is committed back to main with [skip ci] so it cannot
  # retrigger this workflow.
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: bump
        run: |
          CONF=src-tauri/tauri.conf.json
          CURRENT=$(node -p "require('./$CONF').version")
          NEXT=$(node -e "const [a,b,c]='$CURRENT'.split('.');console.log(\`\${a}.\${b}.\${+c+1}\`)")
          node -e "
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('$CONF','utf8'));
            c.version='$NEXT';
            fs.writeFileSync('$CONF', JSON.stringify(c,null,2)+'\n');
          "
          npm pkg set version="$NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "$CURRENT -> $NEXT"

      # The tag is pushed here, not left for GitHub to create at publish time, so
      # the release assets get their final tag-pinned download URLs while the
      # release is still a draft. --atomic keeps the branch and tag in step.
      - name: Commit and tag the bump
        run: |
          TAG=v${{ steps.bump.outputs.version }}
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG [skip ci]"
          git tag "$TAG"
          git push --atomic origin main "refs/tags/$TAG"

      # The release is created exactly once, here, so the build matrix never races to
      # create it. When every build job called tauri-action with only a tagName they
      # each did their own check-then-create, and the loser died on `already_exists`
      # before uploading — dropping its platform out of latest.json and breaking that
      # arch's updater.
      #
      # The id, not the tag, is what the build jobs consume: tauri-action's by-tag lookup
      # cannot see a draft, so a tagName alone would send it right back to creating a
      # second release for the same tag.
      #
      # It starts as a draft: `releases/latest` skips drafts, so a half-finished release
      # is invisible to the updater until `publish` promotes it.
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.bump.outputs.version }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "$TAG" --notes "$RELEASE_BODY"
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # Tests are host-arch and platform-agnostic, so one job covers them. No `needs`, so
  # they start alongside the bump instead of inside a build job that then waits on
  # them. --locked fails if Cargo.lock has drifted from Cargo.toml.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Test artifacts are dev-profile, so they get a key of their own rather than
      # fighting a build job over its release-profile cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  # One job per target. The two macOS arches used to be one universal build, which
  # compiled the whole app twice in series; as separate jobs they overlap instead.
  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      # The tag, not the branch: all three jobs build the same commit even if
      # something lands on main while they run.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # Both macOS jobs report the same OS and arch, so without the target in the
      # key they would overwrite each other with the wrong target's artifacts.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # tauri-action builds, signs the update artifacts, uploads them to the draft,
      # and merges its platform into the latest.json the updater reads. releaseBody
      # is not for the release — the draft already has it — it becomes the `notes`
      # field of latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.bump.outputs.release_id }}
          tagName: v${{ needs.bump.outputs.version }}
          releaseBody: ${{ env.RELEASE_BODY }}
          args: --target ${{ matrix.target }}

      # With no identity configured the bundler seals nothing, and on arm64 that leaves
      # ld's automatic linker-signed signature on the executable with no sealed resources
      # around it — a mismatch Gatekeeper reports as "damaged", not "unsigned", so the
      # usual right-click → Open cannot get past it and the DMG is uninstallable. The `-`
      # identity in tauri.conf.json seals the bundle; this fails the job if it stops
      # happening, which leaves the release a draft rather than shipping that DMG.
      - name: Check the macOS bundle is sealed
        if: runner.os == 'macOS'
        run: |
          APP=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          codesign --verify --strict --verbose=2 \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/$APP.app"

  # Handed a releaseId, tauri-action uploads but never publishes, so promoting the
  # draft is this job's whole purpose. `needs` requires every build to have
  # succeeded: a release missing a platform stays a draft, where `releases/latest`
  # cannot serve its half-populated latest.json to the updater.
  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ID: ${{ needs.bump.outputs.release_id }}
    steps:
      # Green builds do not prove latest.json is whole. Each build job reads it,
      # merges its own platform in, and re-uploads, so two finishing within a second
      # of each other can lose one of the two writes. A dropped platform still
      # leaves its signature on the release, so signatures nothing in latest.json
      # points at are exactly the writes that went missing.
      - name: Check latest.json covers every signed artifact
        run: |
          gh api --paginate "repos/$GH_REPO/releases/$ID/assets" > assets.json
          gh api "repos/$GH_REPO/releases/assets/$(
            jq -r '.[] | select(.name == "latest.json") | .id' assets.json
          )" -H 'Accept: application/octet-stream' > latest.json
          MISSING=$(jq -r --slurpfile latest latest.json '
            [.[].name | select(endswith(".sig")) | rtrimstr(".sig")]
            - [$latest[0].platforms[].url | split("/") | last]
            | join(" ")' assets.json)
          if [ -n "$MISSING" ]; then
            echo "::error::latest.json has no entry for: $MISSING"
            exit 1
          fi

      - name: Publish
        run: gh api -X PATCH "repos/$GH_REPO/releases/$ID" -F draft=false
