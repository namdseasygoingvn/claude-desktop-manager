[package]
name = "cdm"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Create, name, and launch isolated Claude Desktop profiles"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-log = "2.9.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2.5.1"
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
trash = "5.2.6"
sysinfo = "0.39.6"
unicode-normalization = "0.1.25"
clap = { version = "4.6.5", features = ["derive"] }
thiserror = "2.0.19"
# Claude Desktop's HTTP cache holds the /usage response under its content-encoding: zstd in
# every sample seen, gzip as the only other encoding worth decoding.
zstd = "0.13.3"
flate2 = "1.1.9"
# Tray group icons: lucide SVG markup from tray_icons.rs rasterized to a menu image.
usvg = { version = "0.45", default-features = false }
resvg = { version = "0.45", default-features = false }
tiny-skia = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }
